 const pi={t:'c',s:'\u03c0'},kk=mode.a==='DEG'?{t:'div',a:pi,b:NZ(Q(180n))}:mode.a==='GRAD'?{t:'div',a:pi,b:NZ(Q(200n))}:null,ik=mode.a==='DEG'?{t:'div',a:NZ(Q(180n)),b:pi}:mode.a==='GRAD'?{t:'div',a:NZ(Q(200n)),b:pi}:null,w=(x,k)=>k?mulN(k,x):x;
 switch(n.t){
  case'x':return N1;
  case'neg':return negN(dif(n.a));
  case'add':return addN(dif(n.a),dif(n.b));
  case'mul':{if(!hasX(n.a))return mulN(n.a,dif(n.b));if(!hasX(n.b))return mulN(n.b,dif(n.a));return addN(mulN(dif(n.a),n.b),mulN(n.a,dif(n.b)))}
  case'div':{if(!hasX(n.b))return dvN(dif(n.a),n.b);return{t:'div',a:addN(mulN(dif(n.a),n.b),negN(mulN(n.a,dif(n.b)))),b:powN(n.b,N2)}}
  case'pow':{const hb=hasX(n.a),he=hasX(n.b);
   if(!he){const e1=n.b.t==='n'?NZ(Q(n.b.v.n-n.b.v.d,n.b.v.d)):addN(n.b,NZ(Q(-1n)));return mulN(mulN(n.b,powN(n.a,e1)),dif(n.a))}
   if(!hb){if(n.a.t==='c'&&n.a.s==='e')return mulN(n,dif(n.b));return mulN(mulN(n,fN('ln',n.a)),dif(n.b))}
   return mulN(n,addN(mulN(dif(n.b),fN('ln',n.a)),{t:'div',a:mulN(n.b,dif(n.a)),b:n.a}))}
  case'f':{if(n.a.length!==1)throw new Error('NoDiff');const u=n.a[0],du=dif(u),sq=()=>fN('sqrt',addN(N1,negN(powN(u,N2))));
   switch(n.name){
    case'sin':return mulN(w(fN('cos',u),kk),du);
    case'cos':return negN(mulN(w(fN('sin',u),kk),du));
    case'tan':return{t:'div',a:w(du,kk),b:powN(fN('cos',u),N2)};
    case'cot':return negN({t:'div',a:w(du,kk),b:powN(fN('sin',u),N2)});
    case'exp':return mulN(fN('exp',u),du);
    case'ln':return{t:'div',a:du,b:u};
    case'log':return{t:'div',a:du,b:mulN(u,fN('ln',NZ(Q(10n))))};
    case'sqrt':return{t:'div',a:du,b:mulN(N2,fN('sqrt',u))};
    case'abs':return{t:'div',a:mulN(u,du),b:fN('abs',u)};
    case'asin':return w({t:'div',a:du,b:sq()},ik);
    case'acos':return negN(w({t:'div',a:du,b:sq()},ik));
    case'atan':return w({t:'div',a:du,b:addN(N1,powN(u,N2))},ik);
    case'sinh':return mulN(fN('cosh',u),du);case'cosh':return mulN(fN('sinh',u),du);
    case'tanh':return{t:'div',a:du,b:powN(fN('cosh',u),N2)};
    default:throw new Error('NoDiff')}}
  default:throw new Error('NoDiff')}}
LAZY.deriv=(p,c)=>{const ast=parseAST(p[0],c),t=dispS(canon(dif(ast)));if(t==='0')return Q(0n);const v=Q(0n);v.sym=t;v.disp=true;return v};
{const _e=err;err=function(e){if(e&&e.message==='NoDiff'){M.textContent=T2('এই ফাংশনের অন্তরক বের করা যায়নি','Cannot differentiate this expression');M.className='err';S.textContent=T2('সমর্থিত: বহুপদী, sin, cos, tan, e^, ln, log, √, গুণ/ভাগ/ঘাত','Supported: polynomials, sin, cos, tan, e^, ln, log, sqrt, products, quotients, powers');B.textContent='';return}_e(e)}}

 row(1,'<span style="font-size:1.2em">d/dX ( f(X) )</span>',T2('f(x) এর অন্তরক সহগ (প্রতীকী): ফল একটি ফাংশন','Derivative of f(x), symbolic: the result is a function'),'deriv(|)');
 row(2,'<span style="font-size:1.2em">d/dX f(X) |<sub>X=a</sub></span>',T2('x = a বিন্দুতে অন্তরকের মান (সংখ্যা)','Value of the derivative at x = a (a number)'),'diff(|,)');
 bd.append(mk('p',T2('চলক X ব্যবহার করুন (ALPHA + কী) অথবা abc কীবোর্ডে x','Use variable X (ALPHA + key) or x on the abc keyboard')))})}
