<script>
const SET={pct:true,fmt:'norm',n:6,eng:0};
const snap=x=>{if(!isFinite(x))return F(x);const r=Math.round(x),m=Math.max(1,Math.abs(x));if(Math.abs(x-r)<1e-9*m)return Q(BigInt(r));for(let q=2;q<=1000;q++){const p=Math.round(x*q);if(Math.abs(x-p/q)<1e-11*m)return Q(BigInt(p),BigInt(q))}return F(x)};
const evAt=(t,c,x)=>num(evalExpr(t,{...c,vars:{...c.vars,X:x}}));
const fv=v=>{const r=res(v);return r.frac?r.frac+' = '+r.dec:(r.sym||r.dec)};
const fv0=v=>{if(!v)return '0';const r=res(v);return r.frac||r.dec.replace('≈ ','')};
function simp(f,a,b,eps,fa,fm,fb,w,d){const m=(a+b)/2,l=(a+m)/2,r=(m+b)/2,fl=f(l),fr=f(r),L=(m-a)/6*(fa+4*fl+fm),R=(b-m)/6*(fm+4*fr+fb),T=L+R;if(d<=0||Math.abs(T-w)<=15*eps)return T+(T-w)/15;return simp(f,a,m,eps/2,fa,fl,fm,L,d-1)+simp(f,m,b,eps/2,fm,fr,fb,R,d-1)}
LAZY.intg=(p,c)=>{const a=num(evalExpr(p[1],c)),b=num(evalExpr(p[2],c)),f=x=>evAt(p[0],c,F(x)),fa=f(a),fb=f(b),fm=f((a+b)/2);return snap(simp(f,a,b,1e-11,fa,fm,fb,(b-a)/6*(fa+4*fm+fb),18))};
LAZY.diff=(p,c)=>{const x=num(evalExpr(p[1],c)),h=1e-3*Math.max(1,Math.abs(x)),f=t=>evAt(p[0],c,F(t));return snap((-f(x+2*h)+8*f(x+h)-8*f(x-h)+f(x-2*h))/(12*h))};
LAZY.limit=(p,c)=>{const x=num(evalExpr(p[1],c)),f=t=>evAt(p[0],c,F(t)),g=h=>(f(x+h)+f(x-h))/2;return snap((4*g(5e-4)-g(1e-3))/3)};
const loopS=(op_)=>(p,c)=>{const a=int(evalExpr(p[1],c)),b=int(evalExpr(p[2],c));if(b-a>100000n)throw ER();let s=op_===add?Q(0n):Q(1n);for(let i=a;i<=b;i++)s=op_(s,evalExpr(p[0],{...c,vars:{...c.vars,X:Q(i)}}));return s};
LAZY.sigma=loopS(add);LAZY.prod=loopS(mul);
FN.logb=(b,x)=>{const X=num(x),B=num(b);if(!(X>0)||!(B>0)||B===1)throw ER();const l=Math.log(X)/Math.log(B),r=Math.round(l);if(isQ(b)&&isQ(x)&&Math.abs(l-r)<1e-9){const t=pow(b,Q(BigInt(r)));if(t.n===x.n&&t.d===x.d)return Q(BigInt(r))}return F(l)};
FN.divr=(a,b)=>{const x=int(a),y=int(b);if(y===0n)throw ER();const v=Q(x/y);v.sym=(x/y)+' R '+(x%y);return v};
const sup=e=>String(e).replace(/\d/g,d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[d]);
FN.factor=a=>{const n=int(a);if(n<2n||n>10n**13n)throw ER();const v=Q(n),o=[];let m=Number(n);for(let p=2;p*p<=m;p++){let e=0;while(m%p===0){m/=p;e++}if(e)o.push(p+(e>1?sup(e):''))}if(m>1)o.push(String(m));v.sym=o.join('×');return v};
FN.dms=a=>{const x=isQ(a)?a:Q(BigInt(Math.round(a.f*1e9)),1000000000n),ng=x.n<0n,n=A(x.n),d=n/x.d,m60=mul(Q(n%x.d,x.d),Q(60n)),m=m60.n/m60.d,s=mul(sub(m60,Q(m)),Q(60n)),v=Q(x.n,x.d);v.sym=(ng?'-':'')+d+'°'+m+'′'+fmtQ(s)[0]+'″';return v};
FN.cot=v=>div(Q(1n),FN.tan(v));FN.sec=v=>div(Q(1n),FN.cos(v));FN.csc=v=>div(Q(1n),FN.sin(v));
FN.asinh=v=>F(Math.asinh(num(v)));FN.acosh=v=>F(Math.acosh(num(v)));FN.atanh=v=>F(Math.atanh(num(v)));
FN.ranint=(a,b)=>{const x=Number(int(a)),y=Number(int(b));if(y<x)throw ER();return Q(BigInt(x+Math.floor(Math.random()*(y-x+1))))};
FN.pol=(x,y)=>{const X=num(x),Y=num(y),r=Math.hypot(X,Y);let t=Math.atan2(Y,X);t=mode.a==='DEG'?t*180/Math.PI:mode.a==='GRAD'?t*200/Math.PI:t;VARS.X=snap(r);VARS.Y=snap(t);const v=snap(r),o=isQ(v)?Q(v.n,v.d):F(r);o.sym='r='+fmtF(r)+', θ='+fmtF(t);return o};
FN.rec=(r,t)=>{const X=mul(r,FN.cos(t)),Y=mul(r,FN.sin(t));VARS.X=X;VARS.Y=Y;const o=isQ(X)?Q(X.n,X.d):F(X.f);o.sym='x='+res(X).dec+', y='+res(Y).dec;return o};
function erf(x){const a=Math.abs(x);let r;if(a<3){let s=a,t=a;for(let n=1;n<200;n++){t*=-a*a/n;s+=t/(2*n+1)}r=2/Math.sqrt(Math.PI)*s}else{let f=0;for(let k=60;k>=1;k--)f=(k/2)/(a+f);r=1-Math.exp(-a*a)/Math.sqrt(Math.PI)/(a+f)}return x<0?-r:r}
FN.normcdf=(x,m,s)=>{m=m?num(m):0;s=s?num(s):1;if(s<=0)throw ER();return F(0.5*(1+erf((num(x)-m)/(s*Math.SQRT2))))};
FN.normpdf=(x,m,s)=>{m=m?num(m):0;s=s?num(s):1;if(s<=0)throw ER();const z=(num(x)-m)/s;return F(Math.exp(-z*z/2)/(s*Math.sqrt(2*Math.PI)))};
FN.binompdf=(n,p,k)=>{const P=num(p);if(!(P>=0&&P<=1))throw ER();return mul(mul(nCr(n,k),pow(p,k)),pow(sub(Q(1n),p),sub(n,k)))};
FN.binomcdf=(n,p,k)=>{let s=Q(0n);for(let i=0n;i<=int(k);i++)s=add(s,FN.binompdf(n,p,Q(i)));return s};
FN.poissonpdf=(l,k)=>{const L=num(l),K=int(k);if(L<=0||K<0n)throw ER();let f=1;for(let i=2;i<=Number(K);i++)f*=i;return F(Math.exp(-L)*Math.pow(L,Number(K))/f)};
FN.poissoncdf=(l,k)=>{let s=0;for(let i=0n;i<=int(k);i++)s+=num(FN.poissonpdf(l,Q(i)));return F(s)};
const SIP={'-24':'y','-21':'z','-18':'a','-15':'f','-12':'p','-9':'n','-6':'μ','-3':'m','0':'','3':'k','6':'M','9':'G','12':'T','15':'P','18':'E'};
function engS(x,si){if(x===0)return '0';const e=Math.floor(Math.log10(Math.abs(x))/3)*3,ms=String(parseFloat((x/Math.pow(10,e)).toPrecision(10)));return si&&SIP[e]!==undefined?ms+(SIP[e]?' '+SIP[e]:''):ms+(e?'×10^'+e:'')}
window.FMT=(v,r)=>{if(SET.fmt==='norm'&&!SET.eng)return r;const x=num(v);if(!isFinite(x))return r;let t;if(SET.eng)t=engS(x,SET.eng===2);else if(SET.fmt==='fix')t=x.toFixed(SET.n);else t=x.toExponential(SET.n-1).replace(/e\+?(-?)(\d+)/,'×10^$1$2');return{q:false,dec:t,frac:null,sym:null}};
